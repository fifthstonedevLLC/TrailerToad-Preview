server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative so they work behind Dokploy's proxy (HTTPS is handled there).
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Pages: always revalidate so edits show up immediately.
    # /trailer-toad and /trailer-toad.html both work.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # CSS and JS are versioned with ?v= in the pages, so they can be cached for a long time.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Images and video: cache for 30 days. nginx serves byte ranges, so the hero video can seek.
    location ~* \.(?:webp|jpe?g|png|svg|ico|mp4|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
